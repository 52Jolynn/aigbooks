name: aigbooks

services:
  db:
    image: postgres:15.8-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aigbooks}
      POSTGRES_USER: ${POSTGRES_USER:-aigbooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AIGBOOKS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aigbooks}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-aigbooks}
      AIGBOOKS_LOG_TO_CONSOLE: "true"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["tini", "--", "alembic", "upgrade", "head"]
    command: []
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AIGBOOKS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aigbooks}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-aigbooks}
      AIGBOOKS_EVIDENCE_DIR: /app/var/evidence
      AIGBOOKS_COVERS_DIR: /app/var/covers
      AIGBOOKS_LOG_DIR: /app/var/logs
      AIGBOOKS_LOG_TO_CONSOLE: "true"
    volumes:
      - app-data:/app/var
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
  app-data: